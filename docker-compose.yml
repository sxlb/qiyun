services:
  qiyun:
    # 预编译镜像，无需本地构建。仓库与标签均可由环境变量覆盖：
    #   GHCR_IMAGE  镜像仓库（默认 ghcr.io/sxlb/qiyun；可指向 Docker Hub 或镜像加速地址）。
    #               注意：deploy.sh 与更新执行器总会显式注入该变量（默认 Docker Hub，
    #               并在官方源不通时自动改用备用源或公共加速器），这里的默认值只服务于
    #               「不经脚本、手写 compose 命令」的场景。
    #   IMAGE_TAG   镜像标签（必填，如 0.0.1）。发布链路只推版本标签、不推 latest，
    #               故不设默认值；deploy.sh 与更新脚本会自动注入具体版本号。
    image: ${GHCR_IMAGE:-ghcr.io/sxlb/qiyun}:${IMAGE_TAG:?IMAGE_TAG 未设置，请显式指定版本，如 IMAGE_TAG=0.0.1}
    container_name: qiyun
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env.deploy
    environment:
      # 容器内报告的「当前版本」直接取自镜像标签：lib/version.ts 优先读 APP_VERSION，
      # 缺失时回退到镜像里烘焙的 package.json 版本。
      # 放在这里（而不是各脚本里分别注入）是为了让 deploy.sh 与 scripts/update-watch.sh
      # 由构造保证一致 —— 两条路径各写一遍，很容易只更新一边而长期无人发现。
      APP_VERSION: ${IMAGE_TAG}
    # 限制日志体积
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 健康检查：使用 node 内置 fetch，避免 slim 镜像无 wget/curl
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s