name: Build & Release

# 仅对 tag 推送和手动触发自动构建发布，避免每次 push master 都触发。
# 触发标签与发布产物统一使用「无 v 前缀」的语义化版本号（如 0.0.1）：
# 发布动作本身会以同一名称创建 tag，若允许 v* 触发，一次发布会同时留下
# v0.0.1 与 0.0.1 两个标签，更新链路又只认无 v 标签，容易误填。故只接受无 v 写法。
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  # PR 门禁：合并前就跑 lint / typecheck / 测试，不必等到打 tag 才发现坏代码。
  # release job 已用 if 排除 PR，因此 PR 触发只会跑门禁，不会推镜像或建 release。
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

jobs:
  # ── ① 测试先行：tag push 前拦截坏代码 ──
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare database & generate client
        env:
          DATABASE_URL: file:./prisma/ci-test.db
        run: npx prisma migrate deploy

      # 静态检查与测试同级作为门禁：Next 16 的 next build 已不再内置 ESLint，
      # 不显式跑 lint 等于 ESLint 规则从未生效；类型错误也只在 release job 构建时才暴露，
      # 而那时已经在打 tag 了。两步放在 install + prisma generate 之后，保证 Prisma 客户端类型可用。
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npx vitest run --reporter=verbose

  # ── ② 构建与发布 ──
  release:
    needs: test
    # 仅 tag 推送 / 手动派发时出包；PR 触发只跑上面的门禁
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # 串行化发布：并发 push 时若各自从本地 tag 计算 patch+1，会竞态产生重复版本号
    # （两个 run 都看到 0.0.2 → 都打出 0.0.3，后到者 tag 冲突失败）。
    # 排队（cancel-in-progress: false）保证后一个 run 在前一个完成后才 checkout，
    # 因而能读到最新 tag，版本号稳定递增。
    #
    # 【为何是 job 级而非 workflow 级】并发组解决的只是「版本号计算」这一个竞态，
    # 那是本 job 的职责。若放在 workflow 级，PR 的 test run 也会进入同一个组，
    # 而同组内新排队者会取消「等待中」的旧 run —— 表现为一个 PR 可能把排队中的发布 run
    # 挤掉，发布被静默跳过。因此收敛到本 job。
    concurrency:
      group: release
      cancel-in-progress: false
    # Docker Hub 为可选镜像源（境内直连 GHCR 常受限）。未配置密钥时相关步骤自动跳过，
    # 不阻断发布。需在仓库 Settings → Secrets and variables → Actions 添加：
    #   DOCKERHUB_USERNAME = sxlb
    #   DOCKERHUB_TOKEN    = Docker Hub 访问令牌（Access Token，非登录密码）
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 完整历史 + tags：供版本递增与 Release Notes 的 CHANGELOG 链接使用
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          # 版本号来源优先级：
          #   1) 本次触发用的标签本身就是语义化版本（如 0.0.3）→ 直接采用（`${REF#v}` 兼容历史 v 写法）
          #   2) 否则回退为「已发布的最大语义化版本 patch+1」；一个版本标签都没有时首发 0.0.1
          # ⚠️ 不能用 `git tag -l` 取最大值再 +1 —— checkout 会把本次触发用的标签一并拉下来，
          #    导致推 0.0.3 被算成 0.0.4，发布版本凭空跳号（v0.0.1 那次就是这么失败的）。
          REF="${GITHUB_REF_NAME}"
          if [[ "$REF" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="${REF#v}"
          else
            PREV=$(git tag -l | grep -E '^v?[0-9]+(\.[0-9]+){2}$' | sed -E 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
            if [ -n "$PREV" ]; then
              MAJ=${PREV%%.*}; _r=${PREV#*.}; MIN=${_r%%.*}; PAT=$(( ${_r##*.} + 1 ))
              VERSION="$MAJ.$MIN.$PAT"
            else
              VERSION="0.0.1"
            fi
          fi
          # 中国时区（Asia/Shanghai）时间：写入 Release 标题 / 说明
          CN_TIME=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "TAG=$VERSION" >> "$GITHUB_OUTPUT"
          echo "CN_TIME=$CN_TIME" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # 将本次 release 版本同步进 package.json / package-lock.json（仅工作区，不提交回仓库，避免 CI 循环），
      # 使构建产物内嵌的"当前版本"（CURRENT_VERSION）与本次发布版本一致。
      # 不用 `npm version`：当版本与现有值相同时它会以 "Version not changed" 报错（exit 1）而打断首发构建。
      - name: Sync version into package.json
        run: |
          node -e '
            const fs = require("fs");
            const v = process.argv[1];
            for (const f of ["package.json", "package-lock.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              j.version = v;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }
          ' "${{ steps.version.outputs.VERSION }}"

      - name: Install dependencies
        run: npm ci

      - name: Prepare database & build
        env:
          DATABASE_URL: file:./prisma/ci.db
        run: |
          # 首页为 ISR，构建期会查询 Profile，需要先迁移出一个可用空库
          npx prisma migrate deploy
          npm run build

      - name: Generate release notes
        run: python3 .github/scripts/release-notes.py
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          TAG: ${{ steps.version.outputs.TAG }}
          CN_TIME: ${{ steps.version.outputs.CN_TIME }}
          REPO: sxlb/qiyun

      - name: Package standalone artifact
        run: |
          set -euo pipefail
          mkdir -p dist/qiyun
          cp -r .next/standalone/. dist/qiyun/
          cp -r .next/static dist/qiyun/.next/static
          cp -r public dist/qiyun/public
          cp -r prisma dist/qiyun/prisma
          cp -r scripts dist/qiyun/scripts
          # seed.js 在 Next standalone 之外运行，而 bcryptjs 不会被 standalone 打包（实测缺失），
          # 与 Dockerfile 里 `COPY --from=builder /app/node_modules/bcryptjs` 同一原因，此处显式补上，
          # 否则「裸机模式」执行 node prisma/seed.js 会报 Cannot find module 'bcryptjs'
          mkdir -p dist/qiyun/node_modules
          cp -r node_modules/bcryptjs dist/qiyun/node_modules/bcryptjs
          cp package.json package-lock.json dist/qiyun/
          cp Dockerfile docker-compose.yml deploy.sh .env.deploy.example dist/qiyun/
          # ---------- 剥离运行期数据 ----------
          # 发布包是公开可下载的，任何本地/运行期数据都不能进包。以下三类都是实际踩到过的：
          #   1) .env            —— next build 会把仓库根 .env 原样拷进 .next/standalone（实测 SHA256 一致）
          #   2) data/           —— 同上，data/ 整个目录（prod.db、uploads、wallpapers）会被拷进 standalone
          #   3) prisma 下的 *.db* —— 本地跑过 migrate 就会留下 dev.db / validate.db，CI 会留下 ci.db
          # 统一在此剥离，并由下方自检兜底，避免以后再逐个打补丁。
          # ⚠️ 必须排除 *.example：`.env.*` 通配会连 .env.deploy.example 一起删掉，
          #    而 deploy.sh 依赖该模板生成 .env.deploy（曾因此让一键部署在第 1 步就失败）。
          find dist/qiyun -name '.env*' ! -name '*.example' -delete
          rm -rf dist/qiyun/data
          find dist/qiyun -type f -name '*.db*' -delete

          # ---------- 自检：任一残留即中止发布 ----------
          fail=0
          # 排除示例模板：模板本就在包内，需要剥离的只是真实密钥文件
          if find dist/qiyun -name '.env*' ! -name '*.example' -print -quit | grep -q .; then
            echo "✗ 发布包内存在 .env 文件：" >&2; find dist/qiyun -name '.env*' ! -name '*.example' >&2; fail=1
          fi
          # 部署必需文件必须在包内：上面那次误删就是这么漏出去的，缺一个即中止
          for f in deploy.sh docker-compose.yml .env.deploy.example; do
            [ -f "dist/qiyun/$f" ] || { echo "✗ 发布包缺少必需文件：$f" >&2; fail=1; }
          done
          if [ -e dist/qiyun/data ]; then
            echo "✗ 发布包内存在 data 目录：" >&2; ls -la dist/qiyun/data >&2; fail=1
          fi
          if find dist/qiyun -type f -name '*.db*' -print -quit | grep -q .; then
            echo "✗ 发布包内存在 SQLite 数据库文件：" >&2; find dist/qiyun -type f -name '*.db*' >&2; fail=1
          fi
          [ "$fail" = "0" ] || { echo "已中止发布" >&2; exit 1; }
          tar -C dist -czf "qiyun-${{ steps.version.outputs.TAG }}.tar.gz" qiyun

      # 成品包二次校验：上面校验的是 dist/ 目录树，这里校验真正要发布的 .tar.gz，
      # 防止打包环节（tar 参数、路径变化等）把必需文件漏掉。
      - name: Validate deploy package
        run: |
          set -euo pipefail
          PKG="qiyun-${{ steps.version.outputs.TAG }}.tar.gz"
          [ -f "$PKG" ] || { echo "✗ 未找到发布包 $PKG" >&2; exit 1; }
          entries="$(tar -tzf "$PKG")"
          fail=0
          # 部署必需文件：deploy.sh 依赖 .env.deploy.example 生成 .env.deploy
          for f in server.js deploy.sh docker-compose.yml .env.deploy.example; do
            if ! printf '%s\n' "$entries" | grep -qx "qiyun/$f"; then
              echo "✗ 发布包缺少必需文件：$f" >&2
              fail=1
            fi
          done
          # 除示例模板外不应夹带任何 .env 类文件（node_modules 内的同名文件不算）
          leaked="$(printf '%s\n' "$entries" | grep '\.env' | grep -v '\.example$' | grep -v '^qiyun/node_modules/' || true)"
          if [ -n "$leaked" ]; then
            echo "✗ 发布包内含疑似密钥文件：" >&2
            printf '%s\n' "$leaked" >&2
            fail=1
          fi
          [ "$fail" = "0" ] || { echo "已中止发布" >&2; exit 1; }
          echo "✓ 发布包校验通过：$PKG"

      # 源码产物：与部署包相互独立，供「源码构建」方式使用（无需 git 即可拿到源码）。
      # 刻意不合并进部署包 —— 实测 next build 会把 components/*.tsx 等源文件按需拷进
      # .next/standalone，源码与产物混在同一目录会互相覆盖。
      - name: Package source artifact
        run: |
          set -euo pipefail
          mkdir -p dist-src/qiyun
          git ls-files -z | xargs -0 cp --parents -t dist-src/qiyun/
          tar -C dist-src -czf "qiyun-src-${{ steps.version.outputs.TAG }}.tar.gz" qiyun
          echo "源码包收录文件数：$(git ls-files | wc -l)"

      # ---------- 推送镜像（GHCR + Docker Hub，供服务器"拉取镜像"更新模式使用） ----------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 未配置 DOCKERHUB_TOKEN 时跳过登录（此时也不会生成 Docker Hub 标签）
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 版本不可覆盖：同一版本号一旦发布过就不再覆盖。覆盖会把上一次的 index 及其子清单
      # 变成无标签残留（0.0.1 重发时就这样堆出三个孤儿清单）。要修已发布版本请递增版本号；
      # 确需原地重发的完整步骤见 docs/releasing.md。
      - name: Guard against republishing an existing version
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.TAG }}"
          IMAGE="ghcr.io/sxlb/qiyun:${TAG}"
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "✗ 版本 ${TAG} 已发布（${IMAGE} 已存在），拒绝覆盖" >&2
            echo "  请递增版本号后重新发布；确需原地重发见 docs/releasing.md" >&2
            exit 1
          fi
          echo "✓ 版本 ${TAG} 尚未发布，继续"

      # 只推版本标签（如 0.0.1），不推 latest：latest 是浮动标签，回滚时容易把
      # 「回退旧版」误做成「拉到最新版」。同一份构建产物按是否配置 Docker Hub 密钥
      # 动态拼装标签，同时推两个仓库，避免重复构建并保证两边 digest 一致。
      - name: Compose image tags
        id: tags
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.TAG }}"
          DH_TAG=""
          if [ -n "${DOCKERHUB_TOKEN:-}" ] && [ -n "${DOCKERHUB_USERNAME:-}" ]; then
            DH_TAG="docker.io/${DOCKERHUB_USERNAME}/qiyun:${TAG}"
          else
            echo "::notice::未配置 DOCKERHUB_TOKEN，本次仅推送 GHCR"
          fi
          {
            echo "list<<EOF"
            echo "ghcr.io/sxlb/qiyun:${TAG}"
            if [ -n "$DH_TAG" ]; then echo "$DH_TAG"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: 栖云 · Qiyun ${{ steps.version.outputs.VERSION }} · ${{ steps.version.outputs.CN_TIME }} (UTC+8)
          body_path: RELEASE_NOTES.md
          files: |
            qiyun-${{ steps.version.outputs.TAG }}.tar.gz
            qiyun-src-${{ steps.version.outputs.TAG }}.tar.gz