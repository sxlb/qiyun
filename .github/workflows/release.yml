name: Build & Release

# 仅对 tag 推送和手动触发自动构建发布，避免每次 push master 都触发。
# 触发标签与发布产物统一使用「无 v 前缀」的语义化版本号（如 0.0.1）：
# 发布动作本身会以同一名称创建 tag，若允许 v* 触发，一次发布会同时留下
# v0.0.1 与 0.0.1 两个标签，更新链路又只认无 v 标签，容易误填。故只接受无 v 写法。
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  # PR 门禁：合并前就跑 lint / typecheck / 测试，不必等到打 tag 才发现坏代码。
  # 发布相关 job 已用 if 排除 PR，因此 PR 触发只会跑门禁，不会推镜像或建 release。
  pull_request: {}
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只构建不发布：两个架构各编译一次，不推镜像、不建 Release'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

# 发布流程之间串行：并发 push 时若各自从本地 tag 计算 patch+1，会竞态产生重复版本号
# （两个 run 都看到 0.0.2 → 都打出 0.0.3，后到者 tag 冲突失败）。排队（cancel-in-progress:
# false）保证后一个 run 在前一个完成后才 checkout，因而能读到最新 tag，版本号稳定递增。
# ⚠️ 不能简单写成 group: release —— 同组内新入队的 run 会取消此前处于 pending 的 run，
#    那样一个 PR 门禁 run 就能把排队中的发布 run 顶掉、发布被静默跳过。
#    因此让 PR 走各自独立的分组，只有发布之间才共享同一个组。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_id || 'release' }}
  cancel-in-progress: false

jobs:
  # ── ① 测试先行：tag push 前拦截坏代码 ──
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare database & generate client
        env:
          DATABASE_URL: file:./prisma/ci-test.db
        run: npx prisma migrate deploy

      # 静态检查与测试同级作为门禁：Next 16 的 next build 已不再内置 ESLint，
      # 不显式跑 lint 等于 ESLint 规则从未生效；类型错误也只在 release job 构建时才暴露，
      # 而那时已经在打 tag 了。两步放在 install + prisma generate 之后，保证 Prisma 客户端类型可用。
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npx vitest run --reporter=verbose

  # ── ② 版本计算：后续 job 共用同一个版本号 ──
  # 单独成 job 的原因：镜像要按架构分两台机器构建（amd64 / arm64），
  # 版本号必须在一处算好再分发；每个 job 各算一次就可能算出不同的值。
  prepare:
    needs: test
    # 仅 tag 推送 / 手动派发时出包；PR 触发只跑上面的门禁
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.version.outputs.VERSION }}
      TAG: ${{ steps.version.outputs.TAG }}
      CN_TIME: ${{ steps.version.outputs.CN_TIME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 完整历史 + tags：供版本递增与 Release Notes 的 CHANGELOG 链接使用
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          # 版本号来源优先级：
          #   1) 本次触发用的标签本身就是语义化版本（如 0.0.3）→ 直接采用（`${REF#v}` 兼容历史 v 写法）
          #   2) 否则回退为「已发布的最大语义化版本 patch+1」；一个版本标签都没有时首发 0.0.1
          # ⚠️ 不能用 `git tag -l` 取最大值再 +1 —— checkout 会把本次触发用的标签一并拉下来，
          #    导致推 0.0.3 被算成 0.0.4，发布版本凭空跳号（v0.0.1 那次就是这么失败的）。
          REF="${GITHUB_REF_NAME}"
          if [[ "$REF" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="${REF#v}"
          else
            PREV=$(git tag -l | grep -E '^v?[0-9]+(\.[0-9]+){2}$' | sed -E 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
            if [ -n "$PREV" ]; then
              MAJ=${PREV%%.*}; _r=${PREV#*.}; MIN=${_r%%.*}; PAT=$(( ${_r##*.} + 1 ))
              VERSION="$MAJ.$MIN.$PAT"
            else
              VERSION="0.0.1"
            fi
          fi
          # 中国时区（Asia/Shanghai）时间：写入 Release 标题 / 说明
          CN_TIME=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M')
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "TAG=$VERSION" >> "$GITHUB_OUTPUT"
          echo "CN_TIME=$CN_TIME" >> "$GITHUB_OUTPUT"

  # ── ③ 打包发布产物：部署包 + 源码包 + Release Notes ──
  package:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 把 job 级输出落回 step 输出：下方步骤沿用既有的 steps.version.outputs.* 引用，
      # 避免为改名而大范围改动那些带详细注释的打包与校验步骤。
      - name: Resolve version
        id: version
        run: |
          echo "VERSION=${{ needs.prepare.outputs.VERSION }}" >> "$GITHUB_OUTPUT"
          echo "TAG=${{ needs.prepare.outputs.TAG }}" >> "$GITHUB_OUTPUT"
          echo "CN_TIME=${{ needs.prepare.outputs.CN_TIME }}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # 将本次 release 版本同步进 package.json / package-lock.json（仅工作区，不提交回仓库，避免 CI 循环），
      # 使构建产物内嵌的"当前版本"（CURRENT_VERSION）与本次发布版本一致。
      # 不用 `npm version`：当版本与现有值相同时它会以 "Version not changed" 报错（exit 1）而打断首发构建。
      - name: Sync version into package.json
        run: |
          node -e '
            const fs = require("fs");
            const v = process.argv[1];
            for (const f of ["package.json", "package-lock.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              j.version = v;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }
          ' "${{ steps.version.outputs.VERSION }}"

      - name: Install dependencies
        run: npm ci

      - name: Prepare database & build
        env:
          DATABASE_URL: file:./prisma/ci.db
        run: |
          # 首页为 ISR，构建期会查询 Profile，需要先迁移出一个可用空库
          npx prisma migrate deploy
          npm run build

      - name: Generate release notes
        run: python3 .github/scripts/release-notes.py
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          TAG: ${{ steps.version.outputs.TAG }}
          CN_TIME: ${{ steps.version.outputs.CN_TIME }}
          REPO: sxlb/qiyun

      - name: Package standalone artifact
        run: |
          set -euo pipefail
          mkdir -p dist/qiyun
          cp -r .next/standalone/. dist/qiyun/
          cp -r .next/static dist/qiyun/.next/static
          cp -r public dist/qiyun/public
          cp -r prisma dist/qiyun/prisma
          cp -r scripts dist/qiyun/scripts
          # seed.js 在 Next standalone 之外运行，而 bcryptjs 不会被 standalone 打包（实测缺失），
          # 与 Dockerfile 里 `COPY --from=builder /app/node_modules/bcryptjs` 同一原因，此处显式补上，
          # 否则「裸机模式」执行 node prisma/seed.js 会报 Cannot find module 'bcryptjs'
          mkdir -p dist/qiyun/node_modules
          cp -r node_modules/bcryptjs dist/qiyun/node_modules/bcryptjs
          cp package.json package-lock.json dist/qiyun/
          cp Dockerfile docker-compose.yml deploy.sh .env.deploy.example dist/qiyun/
          # ---------- 剥离运行期数据 ----------
          # 发布包是公开可下载的，任何本地/运行期数据都不能进包。以下三类都是实际踩到过的：
          #   1) .env            —— next build 会把仓库根 .env 原样拷进 .next/standalone（实测 SHA256 一致）
          #   2) data/           —— 同上，data/ 整个目录（prod.db、uploads、wallpapers）会被拷进 standalone
          #   3) prisma 下的 *.db* —— 本地跑过 migrate 就会留下 dev.db / validate.db，CI 会留下 ci.db
          # 统一在此剥离，并由下方自检兜底，避免以后再逐个打补丁。
          # ⚠️ 必须排除 *.example：`.env.*` 通配会连 .env.deploy.example 一起删掉，
          #    而 deploy.sh 依赖该模板生成 .env.deploy（曾因此让一键部署在第 1 步就失败）。
          find dist/qiyun -name '.env*' ! -name '*.example' -delete
          rm -rf dist/qiyun/data
          find dist/qiyun -type f -name '*.db*' -delete

          # ---------- 自检：任一残留即中止发布 ----------
          fail=0
          # 排除示例模板：模板本就在包内，需要剥离的只是真实密钥文件
          if find dist/qiyun -name '.env*' ! -name '*.example' -print -quit | grep -q .; then
            echo "✗ 发布包内存在 .env 文件：" >&2; find dist/qiyun -name '.env*' ! -name '*.example' >&2; fail=1
          fi
          # 部署必需文件必须在包内：上面那次误删就是这么漏出去的，缺一个即中止
          # scripts/ 也在列：更新通道靠它安装，教程里让用户直接从包里取用
          for f in server.js deploy.sh docker-compose.yml .env.deploy.example scripts/setup-update.sh scripts/update-watch.sh; do
            [ -f "dist/qiyun/$f" ] || { echo "✗ 发布包缺少必需文件：$f" >&2; fail=1; }
          done
          if [ -e dist/qiyun/data ]; then
            echo "✗ 发布包内存在 data 目录：" >&2; ls -la dist/qiyun/data >&2; fail=1
          fi
          if find dist/qiyun -type f -name '*.db*' -print -quit | grep -q .; then
            echo "✗ 发布包内存在 SQLite 数据库文件：" >&2; find dist/qiyun -type f -name '*.db*' >&2; fail=1
          fi
          [ "$fail" = "0" ] || { echo "已中止发布" >&2; exit 1; }
          tar -C dist -czf "qiyun-${{ steps.version.outputs.TAG }}.tar.gz" qiyun

      # 成品包二次校验：上面校验的是 dist/ 目录树，这里校验真正要发布的 .tar.gz，
      # 防止打包环节（tar 参数、路径变化等）把必需文件漏掉。
      - name: Validate deploy package
        run: |
          set -euo pipefail
          PKG="qiyun-${{ steps.version.outputs.TAG }}.tar.gz"
          [ -f "$PKG" ] || { echo "✗ 未找到发布包 $PKG" >&2; exit 1; }
          entries="$(tar -tzf "$PKG")"
          fail=0
          # 部署必需文件：deploy.sh 依赖 .env.deploy.example 生成 .env.deploy
          # ⚠️ 不可写成 `printf '%s\n' "$entries" | grep -qx "..."`：grep -q 命中即退出会
          #    让 printf 收到 EPIPE 而失败，叠加 set -o pipefail 后整条管道被判为非零，
          #    明明存在的文件会被误报缺失（0.0.2 的发布就是这么被拦下的）。here-string 无此竞态。
          for f in server.js deploy.sh docker-compose.yml .env.deploy.example scripts/setup-update.sh scripts/update-watch.sh; do
            if ! grep -qxF -- "qiyun/$f" <<< "$entries"; then
              echo "✗ 发布包缺少必需文件：$f" >&2
              fail=1
            fi
          done
          # 除示例模板外不应夹带任何 .env 类文件（node_modules 内的同名文件不算）
          leaked="$(grep '\.env' <<< "$entries" | grep -v '\.example$' | grep -v '^qiyun/node_modules/' || true)"
          if [ -n "$leaked" ]; then
            echo "✗ 发布包内含疑似密钥文件：" >&2
            printf '%s\n' "$leaked" >&2
            fail=1
          fi
          [ "$fail" = "0" ] || { echo "已中止发布" >&2; exit 1; }
          echo "✓ 发布包校验通过：$PKG"

      # 源码产物：与部署包相互独立，供「源码构建」方式使用（无需 git 即可拿到源码）。
      # 刻意不合并进部署包 —— 实测 next build 会把 components/home/*.tsx 等源文件按需拷进
      # .next/standalone，源码与产物混在同一目录会互相覆盖。
      - name: Package source artifact
        run: |
          set -euo pipefail
          mkdir -p dist-src/qiyun
          git ls-files -z | xargs -0 cp --parents -t dist-src/qiyun/
          tar -C dist-src -czf "qiyun-src-${{ steps.version.outputs.TAG }}.tar.gz" qiyun
          echo "源码包收录文件数：$(git ls-files | wc -l)"

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            qiyun-${{ needs.prepare.outputs.TAG }}.tar.gz
            qiyun-src-${{ needs.prepare.outputs.TAG }}.tar.gz
            RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 1

  # ── ④ 镜像构建：按架构分两台机器并行，各自原生编译 ──
  # 为什么必须「各自原生构建」，而不是在一台机器上用 QEMU 模拟出另一个架构：
  # Dockerfile 是在镜像内跑 npm ci + next build 的完整构建，产物里含平台相关的二进制
  # （Prisma 查询引擎、@next/swc）。跨架构复用产物会「构建成功、运行时报错」，比单架构更糟。
  # arm64 用 GitHub 的免费原生 runner（公开仓库免费），构建速度比 QEMU 快一个数量级。
  image:
    needs: prepare
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    # Docker Hub 为可选镜像源（境内直连 GHCR 常受限）。未配置密钥时相关步骤自动跳过，
    # 不阻断发布。需在仓库 Settings → Secrets and variables → Actions 添加：
    #   DOCKERHUB_USERNAME = sxlb
    #   DOCKERHUB_TOKEN    = Docker Hub 访问令牌（Access Token，非登录密码）
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # 版本号必须与 package job 用同一个：镜像内嵌的「当前版本」取自 package.json
      - name: Sync version into package.json
        run: |
          node -e '
            const fs = require("fs");
            const v = process.argv[1];
            for (const f of ["package.json", "package-lock.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              j.version = v;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }
          ' "${{ needs.prepare.outputs.VERSION }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 未配置 DOCKERHUB_TOKEN 时跳过登录（此时也不会把镜像推到 Docker Hub）
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 版本不可覆盖：同一版本号一旦发布过就不再覆盖。覆盖会把上一次的 index 及其子清单
      # 变成无标签残留（0.0.1 重发时就这样堆出三个孤儿清单）。要修已发布版本请递增版本号；
      # 确需原地重发的完整步骤见 docs/releasing.md。
      - name: Guard against republishing an existing version
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.TAG }}"
          IMAGE="ghcr.io/sxlb/qiyun:${TAG}"
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "✗ 版本 ${TAG} 已发布（${IMAGE} 已存在），拒绝覆盖" >&2
            echo "  请递增版本号后重新发布；确需原地重发见 docs/releasing.md" >&2
            exit 1
          fi
          echo "✓ 版本 ${TAG} 尚未发布，继续"

      # 每个架构都要同时推到两个仓库：合成多架构清单时，被引用的单架构清单必须在
      # 目标仓库里存在，否则清单指向一堆不存在的 digest，拉取直接失败。
      - name: Compose image names
        id: names
        run: |
          set -euo pipefail
          NAMES="name=ghcr.io/sxlb/qiyun"
          if [ -n "${DOCKERHUB_TOKEN:-}" ] && [ -n "${DOCKERHUB_USERNAME:-}" ]; then
            NAMES="${NAMES},name=docker.io/${DOCKERHUB_USERNAME}/qiyun"
          else
            echo "::notice::未配置 DOCKERHUB_TOKEN，本次仅推送 GHCR"
          fi
          echo "outputs=type=image,${NAMES},push-by-digest=true,name-canonical=true,push=true" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # 只推 digest、不推版本标签：两个架构并行构建，谁先完成是不确定的，
          # 直接推同名标签会被后完成者覆盖。等两边都好了再由 publish job 合成一个清单。
          # provenance / sbom 会额外产出证明清单，使每个架构推上去的是「索引」而非单平台
          # 清单，合成出来的多架构清单会变成嵌套结构、客户端选平台的行为不可预期。
          # 本版本的核心目标是「拉取时能选对架构」，故这里关掉，代价是失去镜像来源证明。
          outputs: ${{ inputs.dry_run && 'type=cacheonly' || steps.names.outputs.outputs }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        if: ${{ !inputs.dry_run }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── ⑤ 合成多架构清单并发布 ──
  publish:
    needs: [prepare, package, image]
    if: github.event_name != 'pull_request' && !inputs.dry_run
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 只推版本标签（如 0.0.1），不推 latest：latest 是浮动标签，回滚时容易把
      # 「回退旧版」误做成「拉到最新版」。两个仓库用同一次合成，保证两边 digest 一致。
      - name: Create multi-arch manifest
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.TAG }}"
          SRC="ghcr.io/sxlb/qiyun"
          TAGS=(-t "${SRC}:${TAG}")
          if [ -n "${DOCKERHUB_TOKEN:-}" ] && [ -n "${DOCKERHUB_USERNAME:-}" ]; then
            TAGS+=(-t "docker.io/${DOCKERHUB_USERNAME}/qiyun:${TAG}")
          else
            echo "::notice::未配置 DOCKERHUB_TOKEN，本次仅发布 GHCR"
          fi
          mapfile -t FILES < <(find artifacts -type f -name 'sha256:*' | sort)
          [ "${#FILES[@]}" -ge 2 ] || { echo "✗ 架构 digest 少于 2 个，无法合成多架构清单" >&2; exit 1; }
          REFS=()
          for f in "${FILES[@]}"; do REFS+=("${SRC}@sha256:$(basename "$f")"); done
          printf '将合成：%s\n' "${TAGS[*]}"
          printf '来源：%s\n' "${REFS[*]}"
          docker buildx imagetools create "${TAGS[@]}" "${REFS[@]}"

      # 多架构是本版本的核心交付物，合成之后必须验证清单里真的有两个架构：
      # 只判断「命令是否成功」不够——少一个架构同样会返回成功。
      - name: Verify manifest covers both architectures
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.TAG }}"
          OUT="$(docker buildx imagetools inspect "ghcr.io/sxlb/qiyun:${TAG}" 2>&1)"
          echo "$OUT"
          for p in linux/amd64 linux/arm64; do
            if ! grep -q "Platform: *$p" <<< "$OUT"; then
              echo "✗ 多架构清单缺少 $p" >&2
              exit 1
            fi
          done
          echo "✓ 多架构清单已包含 linux/amd64 与 linux/arm64"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.TAG }}
          name: 栖云 · Qiyun ${{ needs.prepare.outputs.VERSION }} · ${{ needs.prepare.outputs.CN_TIME }} (UTC+8)
          body_path: artifacts/packages/RELEASE_NOTES.md
          files: |
            artifacts/packages/qiyun-${{ needs.prepare.outputs.TAG }}.tar.gz
            artifacts/packages/qiyun-src-${{ needs.prepare.outputs.TAG }}.tar.gz